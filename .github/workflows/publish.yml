name: Publish on Marketplace

on:
    workflow_dispatch:
        inputs:
            git_tag:
                description: 'Git tag to publish'
                default: 'v1.0.0'
                required: true

jobs:
    publish:
        name: Publish VS Code Extension
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout code at specified tag
              uses: actions/checkout@v5
              with:
                  ref: ${{ github.event.inputs.git_tag }}

            - name: Setup tools
              uses: jdx/mise-action@v5

            - name: Install dependencies
              run: npm ci

            - name: Package extension
              env:
                  TAG: ${{ github.event.inputs.git_tag }}
              run: |
                  npx vsce package \
                    --out gno.vsix \
                    --baseContentUrl "https://github.com/${{ github.repository }}/blob/$TAG" \
                    --baseImagesUrl "https://github.com/${{ github.repository }}/raw/$TAG"

            # TODO: Publish to Open VSX Registry when we have a token
            # - name: Publish to Open VSX Registry
            #   uses: HaaLeo/publish-vscode-extension@v2
            #   with:
            #     pat: ${{ secrets.OPEN_VSX_TOKEN }}
            #     extensionFile: gno.vsix

            - name: Publish to Visual Studio Marketplace
              run: npx vsce publish --oidc --packagePath gno.vsix
