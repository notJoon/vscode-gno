name: GitHub Release

# Run manually once the version in package.json and its CHANGELOG.md
# section are updated. It tags the current commit with that version and
# creates a GitHub release with the packaged extension.
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup tools
        uses: jdx/mise-action@v5

      - name: Install dependencies
        run: npm ci

      - name: Read version
        id: version
        run: |
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check that the tag does not exist
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::$TAG already exists, bump the version in package.json"
            exit 1
          fi

      - name: Extract release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The section of CHANGELOG.md under the "## <version>" heading.
          awk -v v="$VERSION" '
            BEGIN { gsub(/\./, "\\.", v); re = "^#+ \\[?" v "\\]?[ (]" }
            /^#+ [\[0-9]/ { if (found) exit; if ($0 ~ re) { found = 1; next } }
            found
          ' CHANGELOG.md | sed '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - name: Package extension
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          npx vsce package \
            --pre-release \
            --baseContentUrl "https://github.com/${{ github.repository }}/blob/$TAG" \
            --baseImagesUrl "https://github.com/${{ github.repository }}/raw/$TAG"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" gnolang-*.vsix \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file notes.md
